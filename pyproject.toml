[project]
name = "w518-pcap-extractor"
version = "0.1.0"
description = "Extract UDP payload data from Wireshark pcapng captures"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "scapy>=2.6",
]

[project.scripts]
pcap-extract = "pcapx:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Include main.py at the package root so the script entry-point can find it
packages = ["."]
